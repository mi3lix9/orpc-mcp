name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets a run be re-triggered from the Actions tab without pushing a commit —
  # needed to re-verify after an account/billing block clears, since a blocked
  # run cannot be rerun (it never dispatched a job).
  workflow_dispatch:

# Supersede in-flight runs for the same ref instead of queueing them: a new push
# invalidates the old result, and queued runs waste minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint_and_typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run type:check
      - run: pnpm run build

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24, 22]
      fail-fast: false
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run test
